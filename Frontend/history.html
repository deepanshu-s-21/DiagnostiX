<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiagnostiX - History</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .history-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .history-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--shadow);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .history-date {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .history-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            font-size: 0.85rem;
        }

        .history-badge.low {
            background: var(--success);
        }

        .history-badge.medium {
            background: var(--warning);
        }

        .history-badge.high {
            background: var(--danger);
        }

        .history-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .detail-box {
            background: var(--bg-secondary);
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
        }

        .detail-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .detail-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-primary);
            margin-top: 0.25rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">❤️</span>
                <span data-i18n="app_title">DiagnostiX</span>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link" data-i18n="dashboard">Dashboard</a>
            </nav>
            <div class="controls">
                <select class="lang-select" id="langSelect">
                    <option value="en">English</option>
                    <option value="hi">हिंदी</option>
                </select>
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 style="margin-bottom: 2rem;" data-i18n="history">Assessment History</h1>

        <div id="historyContainer">
            <div class="empty-state">
                <div class="empty-state-icon">📋</div>
                <p>No assessments yet. Start a new assessment to see your history here!</p>
            </div>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="dashboard.html" class="btn btn-primary">← Back to Dashboard</a>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'index.html';
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${API_URL}/history`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                const history = data.history || [];

                const container = document.getElementById('historyContainer');

                if (history.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <p>No assessments yet. Start a new assessment to see your history here!</p>
                        </div>
                    `;
                    return;
                }

                // Sort by date (newest first)
                history.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                container.innerHTML = history.map((item, index) => `
                    <div class="history-item" onclick="viewDetails(${index})">
                        <div class="history-header">
                            <div>
                                <strong>Assessment ${history.length - index}</strong>
                                <div class="history-date">${formatDate(item.timestamp)}</div>
                            </div>
                            <div class="history-badge ${item.risk_level.toLowerCase()}">
                                ${item.risk_level} Risk
                            </div>
                        </div>

                        <div class="history-details">
                            <div class="detail-box">
                                <div class="detail-label">Risk %</div>
                                <div class="detail-value">${Math.round(item.risk_percentage)}%</div>
                            </div>
                            <div class="detail-box">
                                <div class="detail-label">Status</div>
                                <div class="detail-value">
                                    ${item.has_disease ? '⚠️ Risk' : '✓ OK'}
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('historyContainer').innerHTML = `
                    <div class="empty-state">
                        <p>Error loading history. Please try again.</p>
                    </div>
                `;
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function viewDetails(index) {
            // Could expand to show full details
            alert('Assessment details view coming soon!');
        }

        // Load history on page load
        loadHistory();
    </script>
</body>
</html>
