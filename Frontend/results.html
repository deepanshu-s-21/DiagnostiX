<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiagnostiX - Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">❤️</span>
                <span data-i18n="app_title">DiagnostiX</span>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link" data-i18n="dashboard">Dashboard</a>
            </nav>
            <div class="controls">
                <select class="lang-select" id="langSelect">
                    <option value="en">English</option>
                    <option value="hi">हिंदी</option>
                </select>
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2 class="card-title" data-i18n="results">Assessment Results</h2>

            <div class="risk-container">
                <div class="risk-percentage" id="riskPercentage">--</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
                <div class="risk-level" id="riskLevel">Loading...</div>
            </div>

            <div id="diseaseStatus" style="text-align: center; margin-top: 2rem; font-size: 1.2rem;">
            </div>
        </div>

        <div class="card">
            <h3 class="card-title" data-i18n="recommendations">Recommendations</h3>
            <div class="recommendations" id="recommendationsContainer">
                Loading recommendations...
            </div>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="dashboard.html" class="btn btn-primary" data-i18n="back">
                Back to Dashboard
            </a>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <script>
        const result = JSON.parse(localStorage.getItem('lastResult'));

        if (!result) {
            window.location.href = 'dashboard.html';
        }

        // Display results
        const riskPercentage = Math.round(result.risk_percentage);
        const riskLevel = result.risk_level;
        const hasDisease = result.has_disease;

        document.getElementById('riskPercentage').textContent = riskPercentage + '%';
        document.getElementById('riskPercentage').className = `risk-percentage ${riskLevel.toLowerCase()}`;

        // Animate progress bar
        setTimeout(() => {
            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = riskPercentage + '%';

            if (riskLevel === 'Low') {
                progressFill.style.background = 'var(--success)';
            } else if (riskLevel === 'Medium') {
                progressFill.style.background = 'var(--warning)';
            } else {
                progressFill.style.background = 'var(--danger)';
            }
        }, 100);

        const riskLevelEl = document.getElementById('riskLevel');
        riskLevelEl.textContent = riskLevel + ' Risk';
        riskLevelEl.className = `risk-level ${riskLevel.toLowerCase()}`;

        const diseaseStatus = document.getElementById('diseaseStatus');
        if (hasDisease) {
            diseaseStatus.innerHTML = `<strong data-i18n="disease_detected">⚠️ Disease Risk Detected</strong>`;
            diseaseStatus.style.color = 'var(--danger)';
        } else {
            diseaseStatus.innerHTML = `<strong data-i18n="no_disease">✓ No Disease Detected</strong>`;
            diseaseStatus.style.color = 'var(--success)';
        }

        // Generate recommendations
        const recommendations = generateRecommendations(riskLevel, hasDisease);
        const recContainer = document.getElementById('recommendationsContainer');
        recContainer.innerHTML = recommendations.map(rec => 
            `<div class="recommendation-item">${rec}</div>`
        ).join('');

        function generateRecommendations(risk, hasDisease) {
            const recs = [];

            if (risk === 'High' || hasDisease) {
                recs.push('🏥 Consult a cardiologist immediately for proper diagnosis');
                recs.push('📋 Get comprehensive cardiac tests (ECG, Echo, Stress Test)');
                recs.push('💊 Follow prescribed medication strictly');
                recs.push('🚭 Avoid smoking and limit alcohol consumption');
            }

            if (risk === 'Medium') {
                recs.push('👨‍⚕️ Schedule a check-up with your doctor');
                recs.push('🏃 Start moderate exercise (30 min daily walking)');
                recs.push('🥗 Adopt a heart-healthy diet (low salt, low fat)');
                recs.push('📊 Monitor blood pressure and cholesterol regularly');
            }

            if (risk === 'Low') {
                recs.push('✅ Maintain current healthy lifestyle');
                recs.push('🥗 Continue balanced diet rich in fruits and vegetables');
                recs.push('🏃 Regular physical activity (150 min/week)');
                recs.push('🔄 Get annual health check-ups');
            }

            // Universal recommendations
            recs.push('😌 Manage stress through meditation or yoga');
            recs.push('😴 Ensure 7-8 hours of quality sleep');
            recs.push('🧂 Reduce sodium intake to less than 2300mg/day');

            return recs;
        }
    </script>
</body>
</html>
