<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f" />
      <stop offset="100%" stop-color="#0f0f15" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Red/Coral Gradient -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7675" />
      <stop offset="50%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>
  </defs>
  
  <!-- Base Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="#2d2d3f" stroke-width="8" />
  
  <!-- Heart and Pulse Group -->
  <g filter="url(#glow)">
    <!-- Heart Outline (Dotted/Subtle) -->
    <path d="M256,390 L242,376 C190,328 150,292 150,248 C150,212 178,184 214,184 C234,184 248,194 256,204 C264,194 278,184 298,184 C334,184 362,212 362,248 C362,292 322,328 270,376 Z" 
          fill="none" stroke="#2d2d3f" stroke-dasharray="6,6" stroke-width="4" />
          
    <!-- ECG / Pulse Line -->
    <path d="M120,256 L180,256 L200,210 L220,310 L245,170 L270,340 L290,230 L310,275 L330,256 L392,256" 
          fill="none" stroke="url(#pulse-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>