<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiagnostiX - Assessment</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .drag-area {
            min-height: 200px;
            background: var(--bg-secondary);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .drag-area.drag-over {
            background: rgba(231, 76, 60, 0.1);
            border-color: var(--accent-primary);
        }

        .kanban-item.dragging {
            opacity: 0.5;
        }

        .selected-item {
            background: var(--accent-primary);
            color: white;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .selected-item button {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .selected-item button:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">❤️</span>
                <span data-i18n="app_title">DiagnostiX</span>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link" data-i18n="dashboard">Dashboard</a>
            </nav>
            <div class="controls">
                <select class="lang-select" id="langSelect">
                    <option value="en">English</option>
                    <option value="hi">हिंदी</option>
                </select>
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 style="margin-bottom: 2rem;" data-i18n="new_assessment">New Assessment</h1>

        <!-- Patient Information -->
        <div class="card">
            <h3 class="card-title" data-i18n="patient_info">Patient Information</h3>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label class="form-label" data-i18n="age">Age</label>
                    <input type="number" class="form-input" id="age" min="1" max="120" required>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="sex">Sex</label>
                    <select class="form-select" id="sex">
                        <option value="0" data-i18n="female">Female</option>
                        <option value="1" data-i18n="male">Male</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Drag and Drop Symptoms -->
        <div class="card">
            <h3 class="card-title">Drag Symptoms to Selection Area</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
                Drag symptom cards to the selection box below to choose your symptoms
            </p>

            <!-- Available Symptoms -->
            <h4 style="margin-top: 2rem; margin-bottom: 1rem;">Available Symptoms</h4>
            <div class="kanban-board" id="availableSymptoms">
                <!-- Will be populated by JavaScript -->
            </div>

            <!-- Selected Symptoms -->
            <h4 style="margin-top: 2rem; margin-bottom: 1rem;">Selected Symptoms</h4>
            <div class="drag-area" id="selectedArea">
                <div id="selectedItemsContainer" style="min-height: 100px;">
                    <p style="color: var(--text-secondary); text-align: center;">Drag symptoms here</p>
                </div>
            </div>
        </div>

        <!-- Vital Signs -->
        <div class="card">
            <h3 class="card-title">Vital Signs & Lab Results</h3>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label class="form-label" data-i18n="resting_bp">Resting BP (mm Hg)</label>
                    <input type="number" class="form-input" id="resting_bp" min="50" max="250" value="120">
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="cholesterol">Cholesterol (mg/dl)</label>
                    <input type="number" class="form-input" id="cholesterol" min="100" max="600" value="200">
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="fasting_bs">Fasting Blood Sugar</label>
                    <select class="form-select" id="fasting_bs">
                        <option value="0">≤ 120 mg/dl</option>
                        <option value="1">> 120 mg/dl</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="max_hr">Max Heart Rate</label>
                    <input type="number" class="form-input" id="max_hr" min="60" max="220" value="150">
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="oldpeak">ST Depression (Oldpeak)</label>
                    <input type="number" class="form-input" id="oldpeak" min="0" max="10" step="0.1" value="0">
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
            <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'" data-i18n="cancel">
                Cancel
            </button>
            <button class="btn btn-primary" onclick="submitAssessment()" data-i18n="submit">
                Submit Assessment
            </button>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'index.html';
        }

        // Symptom categories
        const symptoms = {
            'chest_pain': [
                { value: 0, name: 'Typical Angina', desc: 'Classic chest pain' },
                { value: 1, name: 'Atypical Angina', desc: 'Unusual chest pain' },
                { value: 2, name: 'Non-Anginal', desc: 'Not related to heart' },
                { value: 3, name: 'Asymptomatic', desc: 'No chest pain' }
            ],
            'resting_ecg': [
                { value: 0, name: 'Normal', desc: 'Normal ECG' },
                { value: 1, name: 'ST-T Abnormality', desc: 'Wave abnormalities' },
                { value: 2, name: 'LV Hypertrophy', desc: 'Enlarged ventricle' }
            ],
            'st_slope': [
                { value: 0, name: 'Upsloping', desc: 'Better prognosis' },
                { value: 1, name: 'Flat', desc: 'Moderate risk' },
                { value: 2, name: 'Downsloping', desc: 'Higher risk' }
            ],
            'exercise_angina': [
                { value: 0, name: 'No', desc: 'No angina during exercise' },
                { value: 1, name: 'Yes', desc: 'Angina during exercise' }
            ]
        };

        const selections = {};

        // Initialize UI
        function initializeSymptoms() {
            const container = document.getElementById('availableSymptoms');
            container.innerHTML = '';

            for (const [category, items] of Object.entries(symptoms)) {
                const column = document.createElement('div');
                column.className = 'kanban-column';

                const header = document.createElement('div');
                header.className = 'kanban-header';
                header.textContent = category.replace(/_/g, ' ').toUpperCase();
                column.appendChild(header);

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'kanban-item';
                    card.draggable = true;
                    card.dataset.field = category;
                    card.dataset.value = item.value;
                    card.innerHTML = `
                        <div class="kanban-item-title">${item.name}</div>
                        <div class="kanban-item-desc">${item.desc}</div>
                    `;

                    card.addEventListener('dragstart', dragStart);
                    card.addEventListener('dragend', dragEnd);

                    column.appendChild(card);
                });

                container.appendChild(column);
            }
        }

        // Drag and Drop Handlers
        function dragStart(e) {
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('field', e.target.dataset.field);
            e.dataTransfer.setData('value', e.target.dataset.value);
            e.dataTransfer.setData('name', e.target.querySelector('.kanban-item-title').textContent);
        }

        function dragEnd(e) {
            e.target.classList.remove('dragging');
        }

        const selectedArea = document.getElementById('selectedArea');

        selectedArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            selectedArea.classList.add('drag-over');
        });

        selectedArea.addEventListener('dragleave', () => {
            selectedArea.classList.remove('drag-over');
        });

        selectedArea.addEventListener('drop', (e) => {
            e.preventDefault();
            selectedArea.classList.remove('drag-over');

            const field = e.dataTransfer.getData('field');
            const value = e.dataTransfer.getData('value');
            const name = e.dataTransfer.getData('name');

            selections[field] = { value: parseInt(value), name };
            updateSelectedDisplay();
        });

        function updateSelectedDisplay() {
            const container = document.getElementById('selectedItemsContainer');

            if (Object.keys(selections).length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); text-align: center;">Drag symptoms here</p>';
                return;
            }

            container.innerHTML = Object.entries(selections).map(([field, data]) => `
                <div class="selected-item">
                    <div>
                        <strong>${field.replace(/_/g, ' ').toUpperCase()}:</strong> ${data.name}
                    </div>
                    <button onclick="removeSelection('${field}')">✕</button>
                </div>
            `).join('');
        }

        function removeSelection(field) {
            delete selections[field];
            updateSelectedDisplay();
        }

        async function submitAssessment() {
            // Validate all selections
            const requiredFields = ['chest_pain', 'resting_ecg', 'st_slope', 'exercise_angina'];
            const missingFields = requiredFields.filter(f => !selections[f]);

            if (missingFields.length > 0) {
                alert('Please select: ' + missingFields.join(', '));
                return;
            }

            const data = {
                age: parseInt(document.getElementById('age').value),
                sex: parseInt(document.getElementById('sex').value),
                chest_pain: selections.chest_pain.value,
                resting_bp: parseInt(document.getElementById('resting_bp').value),
                cholesterol: parseInt(document.getElementById('cholesterol').value),
                fasting_bs: parseInt(document.getElementById('fasting_bs').value),
                resting_ecg: selections.resting_ecg.value,
                max_hr: parseInt(document.getElementById('max_hr').value),
                exercise_angina: selections.exercise_angina.value,
                oldpeak: parseFloat(document.getElementById('oldpeak').value),
                st_slope: selections.st_slope.value
            };

            try {
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('lastResult', JSON.stringify(result));
                    window.location.href = 'results.html';
                } else {
                    alert(result.error || 'Assessment failed');
                }
            } catch (error) {
                alert('Network error. Please check if backend is running.');
            }
        }

        // Initialize on load
        initializeSymptoms();
    </script>
</body>
</html>
