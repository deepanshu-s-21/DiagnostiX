<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiagnostiX Heart - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">❤️</span>
                <span data-i18n="app_title">DiagnostiX Heart</span>
            </div>
            <div class="controls">
                <select class="lang-select" id="langSelect">
                    <option value="en">English</option>
                    <option value="hi">हिंदी</option>
                </select>
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card" style="max-width: 450px; margin: 4rem auto;">
            <h2 class="card-title" data-i18n="login">Login</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;" data-i18n="app_subtitle">
                AI-Powered Heart Disease Prediction
            </p>

            <div id="alertContainer"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" data-i18n="username">Username</label>
                    <input type="text" class="form-input" id="username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="password">Password</label>
                    <input type="password" class="form-input" id="password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="login">
                    Login
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
                Don't have an account? 
                <a href="signup.html" style="color: var(--accent-primary);" data-i18n="signup">Sign Up</a>
            </p>

            <p style="text-align: center; margin-top: 1rem; color: var(--text-secondary);">
                <a href="index.html" style="color: var(--accent-primary); font-size: 0.9rem;">← Back to Home</a>
            </p>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <script>
        const API_URL = 'http://localhost:5000/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';  // Redirect to dashboard
                    }, 1000);
                } else {
                    showAlert(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showAlert('Network error. Please check if backend is running.', 'error');
            }
        });

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
